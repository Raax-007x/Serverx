name: Pure Web-To-APK Auto Generator & Compiler

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  generate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 2. Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: 3. Generate Complete Android Project On-The-Fly
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"
          ICON_B64="${{ github.event.client_payload.icon_b64 }}"

          echo "Generating Android Project Structure for $PACKAGE_NAME..."

          # Package folder path calculation (com.example.app -> com/example/app)
          PKG_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # Directory Structure Creation
          mkdir -p "app/src/main/java/${PKG_PATH}"
          mkdir -p "app/src/main/res/values"
          mkdir -p "app/src/main/res/mipmap-hdpi"
          mkdir -p "app/src/main/res/mipmap-xhdpi"
          mkdir -p "app/src/main/res/mipmap-xxhdpi"

          # -----------------------------------------------------------------
          # 1. settings.gradle.kts
          # -----------------------------------------------------------------
          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WebToApk"
          include(":app")
          EOF

          # -----------------------------------------------------------------
          # 2. Root build.gradle.kts
          # -----------------------------------------------------------------
          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          # -----------------------------------------------------------------
          # 3. App build.gradle.kts
          # -----------------------------------------------------------------
          cat << EOF > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "$PACKAGE_NAME"
              compileSdk = 34

              defaultConfig {
                  applicationId = "$PACKAGE_NAME"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF

          # -----------------------------------------------------------------
          # 4. AndroidManifest.xml
          # -----------------------------------------------------------------
          cat << EOF > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # -----------------------------------------------------------------
          # 5. strings.xml (App Title)
          # -----------------------------------------------------------------
          cat << EOF > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">$APP_NAME</string>
          </resources>
          EOF

          # -----------------------------------------------------------------
          # 6. MainActivity.kt (Full-featured WebView Engine)
          # -----------------------------------------------------------------
          cat << EOF > "app/src/main/java/${PKG_PATH}/MainActivity.kt"
          package $PACKAGE_NAME

          import android.os.Bundle
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              private lateinit var webView: WebView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      useWideViewPort = true
                      loadWithOverviewMode = true
                      cacheMode = WebSettings.LOAD_DEFAULT
                      mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW
                  }

                  webView.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {
                          url?.let { view?.loadUrl(it) }
                          return true
                      }
                  }

                  webView.loadUrl("$APP_URL")
              }

              override fun onBackPressed() {
                  if (::webView.isInitialized && webView.canGoBack()) {
                      webView.goBack()
                  } else {
                      super.onBackPressed()
                  }
              }
          }
          EOF

          # -----------------------------------------------------------------
          # 7. Icon Image Generator (Base64 to PNG)
          # -----------------------------------------------------------------
          if [ -n "$ICON_B64" ]; then
            echo "$ICON_B64" | base64 -d > temp_icon.png
            cp temp_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
            cp temp_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
            cp temp_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          fi

      - name: 4. Build APK using Pre-installed Gradle
        run: |
          gradle assembleDebug --stacktrace

      - name: 5. Deliver Built APK to Telegram Chat
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"

          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            CAPTION="✅ <b>Your Custom APK is Generated!</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>%0A🔗 <b>URL:</b> $APP_URL"

            curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          fi

      - name: 6. Send Failure Alert on Error
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"

          ERROR_MSG="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on GitHub runner."

          curl -s -F chat_id="$CHAT_ID" \
               -F text="$ERROR_MSG" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
