name: Web-To-APK Auto Builder & Telegram Delivery

on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Base Android Project
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Inject Dynamic App Data & Replace Icon
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"
          ICON_B64="${{ github.event.client_payload.icon_b64 }}"

          echo "------------------------------------------------"
          echo "Building APK for: $APP_NAME"
          echo "Package ID: $PACKAGE_NAME"
          echo "Target URL: $APP_URL"
          echo "------------------------------------------------"

          # 1. App Name Update (strings.xml)
          if [ -f "app/src/main/res/values/strings.xml" ]; then
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
          fi

          # 2. Package Name Update (build.gradle.kts / build.gradle)
          if [ -f "app/build.gradle.kts" ]; then
            sed -i "s|applicationId = \".*\"|applicationId = \"$PACKAGE_NAME\"|g" app/build.gradle.kts
          elif [ -f "app/build.gradle" ]; then
            sed -i "s|applicationId \".*\"|applicationId \"$PACKAGE_NAME\"|g" app/build.gradle
          fi

          # 3. Target URL Update in Code
          # Agar MainActivity.kt ya Constants.kt me TARGET_URL hai usko replace karo
          find app/src/main/java -type f \( -name "*.kt" -o -name "*.java" \) -exec sed -i "s|YOUR_TARGET_URL|$APP_URL|g" {} +

          # 4. Icon Replacement (Decode Base64 to PNG)
          if [ -n "$ICON_B64" ]; then
            echo "$ICON_B64" | base64 -d > temp_icon.png

            # Sub mipmap folders me icon update karein
            for dir in app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp temp_icon.png "$dir/ic_launcher.png"
                cp temp_icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              fi
            done
          fi

      - name: 4. Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: 5. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 6. Send Generated APK to Telegram User
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"

          # Locate Generated APK
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            echo "Sending $APK_PATH to Telegram Chat: $CHAT_ID"
            
            CAPTION="✅ <b>Your Custom Web-to-APK is Ready!</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>%0A🔗 <b>URL:</b> $APP_URL"

            curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"
          else
            echo "APK File not found!"
            exit 1
          fi

      - name: 7. Send Error Alert to Telegram User on Failure
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"

          ERROR_MSG="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on GitHub. Please check your source code or dependencies."

          curl -s -F chat_id="$CHAT_ID" \
               -F text="$ERROR_MSG" \
               -F parse_mode="HTML" \
               "https://api.telegram.org/bot$BOT_TOKEN/sendMessage"
