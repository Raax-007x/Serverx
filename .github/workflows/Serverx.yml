name: Web-To-APK Auto Generator & Compiler

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Realtime Progress -> Step 1/3
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Soo"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="⚙️ <b>[Step 1/3] Generating Android Source Code...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Setting up Gradle & AndroidManifest...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Generate & Auto-Push Base Project (If missing)
        run: |
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"
          ICON_B64="${{ github.event.client_payload.icon_b64 }}"

          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.soo.app"; fi
          if [ -z "$APP_NAME" ]; then APP_NAME="Soo"; fi
          if [ -z "$APP_URL" ]; then APP_URL="https://google.com"; fi

          PKG_PATH=$(echo "$PACKAGE_NAME" | tr '.' '/')

          # Ensure gradle.properties exists
          printf '%s\n' \
          'android.useAndroidX=true' \
          'android.enableJetifier=true' \
          'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8' \
          'android.nonTransitiveRclass=true' > gradle.properties

          if [ ! -f "app/build.gradle.kts" ]; then
            echo "Base project missing. Generating full source code..."

            mkdir -p "app/src/main/java/${PKG_PATH}"
            mkdir -p "app/src/main/res/values"
            mkdir -p "app/src/main/res/mipmap-hdpi"
            mkdir -p "app/src/main/res/mipmap-xhdpi"
            mkdir -p "app/src/main/res/mipmap-xxhdpi"

            # 1. settings.gradle.kts
            printf '%s\n' \
            'pluginManagement {' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '        gradlePluginPortal()' \
            '    }' \
            '}' \
            'dependencyResolutionManagement {' \
            '    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)' \
            '    repositories {' \
            '        google()' \
            '        mavenCentral()' \
            '    }' \
            '}' \
            'rootProject.name = "WebToApk"' \
            'include(":app")' > settings.gradle.kts

            # 2. Root build.gradle.kts
            printf '%s\n' \
            'plugins {' \
            '    id("com.android.application") version "8.5.2" apply false' \
            '    id("org.jetbrains.kotlin.android") version "1.9.24" apply false' \
            '}' > build.gradle.kts

            # 3. App build.gradle.kts (With Strict Version Resolution Lock)
            printf '%s\n' \
            'plugins {' \
            '    id("com.android.application")' \
            '    id("org.jetbrains.kotlin.android")' \
            '}' \
            '' \
            'android {' \
            "    namespace = \"$PACKAGE_NAME\"" \
            '    compileSdk = 34' \
            '' \
            '    defaultConfig {' \
            "        applicationId = \"$PACKAGE_NAME\"" \
            '        minSdk = 24' \
            '        targetSdk = 34' \
            '        versionCode = 1' \
            '        versionName = "1.0"' \
            '    }' \
            '' \
            '    compileOptions {' \
            '        sourceCompatibility = JavaVersion.VERSION_17' \
            '        targetCompatibility = JavaVersion.VERSION_17' \
            '    }' \
            '    kotlinOptions {' \
            '        jvmTarget = "17"' \
            '    }' \
            '}' \
            '' \
            'configurations.all {' \
            '    resolutionStrategy {' \
            '        force("androidx.core:core:1.13.1")' \
            '        force("androidx.core:core-ktx:1.13.1")' \
            '        force("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")' \
            '    }' \
            '}' \
            '' \
            'dependencies {' \
            '    implementation("androidx.core:core-ktx:1.13.1")' \
            '    implementation("androidx.appcompat:appcompat:1.7.0")' \
            '    implementation("com.google.android.material:material:1.12.0")' \
            '}' > app/build.gradle.kts

            # 4. AndroidManifest.xml
            printf '%s\n' \
            '<?xml version="1.0" encoding="utf-8"?>' \
            '<manifest xmlns:android="http://schemas.android.com/apk/res/android">' \
            '    <uses-permission android:name="android.permission.INTERNET" />' \
            '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />' \
            '    <application' \
            '        android:allowBackup="true"' \
            '        android:icon="@mipmap/ic_launcher"' \
            '        android:label="@string/app_name"' \
            '        android:roundIcon="@mipmap/ic_launcher"' \
            '        android:supportsRtl="true"' \
            '        android:theme="@style/Theme.AppCompat.NoActionBar"' \
            '        android:usesCleartextTraffic="true">' \
            '        <activity' \
            '            android:name=".MainActivity"' \
            '            android:exported="true"' \
            '            android:configChanges="orientation|screenSize|keyboardHidden">' \
            '            <intent-filter>' \
            '                <action android:name="android.intent.action.MAIN" />' \
            '                <category android:name="android.intent.category.LAUNCHER" />' \
            '            </intent-filter>' \
            '        </activity>' \
            '    </application>' \
            '</manifest>' > app/src/main/AndroidManifest.xml

            # 5. strings.xml
            printf '%s\n' \
            '<resources>' \
            "    <string name=\"app_name\">$APP_NAME</string>" \
            '</resources>' > app/src/main/res/values/strings.xml

            # 6. MainActivity.kt
            printf '%s\n' \
            "package $PACKAGE_NAME" \
            '' \
            'import android.os.Bundle' \
            'import android.webkit.WebSettings' \
            'import android.webkit.WebView' \
            'import android.webkit.WebViewClient' \
            'import androidx.appcompat.app.AppCompatActivity' \
            '' \
            'class MainActivity : AppCompatActivity() {' \
            '    private lateinit var webView: WebView' \
            '' \
            '    override fun onCreate(savedInstanceState: Bundle?) {' \
            '        super.onCreate(savedInstanceState)' \
            '        webView = WebView(this)' \
            '        setContentView(webView)' \
            '' \
            '        webView.settings.apply {' \
            '            javaScriptEnabled = true' \
            '            domStorageEnabled = true' \
            '            databaseEnabled = true' \
            '            useWideViewPort = true' \
            '            loadWithOverviewMode = true' \
            '            cacheMode = WebSettings.LOAD_DEFAULT' \
            '            mixedContentMode = WebSettings.MIXED_CONTENT_ALWAYS_ALLOW' \
            '        }' \
            '' \
            '        webView.webViewClient = object : WebViewClient() {' \
            '            override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {' \
            '                url?.let { view?.loadUrl(it) }' \
            '                return true' \
            '            }' \
            '        }' \
            '' \
            "        webView.loadUrl(\"$APP_URL\")" \
            '    }' \
            '' \
            '    override fun onBackPressed() {' \
            '        if (::webView.isInitialized && webView.canGoBack()) {' \
            '            webView.goBack()' \
            '        } else {' \
            '            super.onBackPressed()' \
            '        }' \
            '    }' \
            '}' > "app/src/main/java/${PKG_PATH}/MainActivity.kt"

            # Generate Gradle Wrapper
            gradle wrapper --gradle-version 8.7
            chmod +x gradlew

            # Commit & Push Base Code
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "Auto-generated Base Android Project files" || true
            git push origin HEAD || true

          else
            echo "Base project already exists. Updating values..."
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">$APP_NAME</string>|g" app/src/main/res/values/strings.xml
            find app/src/main/java -name "MainActivity.kt" -exec sed -i "s|loadUrl(\".*\")|loadUrl(\"$APP_URL\")|g" {} +
          fi

          chmod +x gradlew || true

          # Guaranteed Icon Generation Logic
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi

          # Fallback default PNG icon
          DEFAULT_ICON_B64=""

          echo "$DEFAULT_ICON_B64" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
          echo "$DEFAULT_ICON_B64" | base64 -d > app/src/main/res/mipmap-xhdpi/ic_launcher.png
          echo "$DEFAULT_ICON_B64" | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          # Override with user custom Base64 Icon if present
          if [ -n "$ICON_B64" ]; then
            CLEAN_B64=$(echo "$ICON_B64" | sed -e 's/data:image\/[a-zA-Z]*;base64,//g' | tr -d '\r\n ')
            echo "$CLEAN_B64" | base64 -d > temp_icon.png 2>/dev/null || true
            if [ -s temp_icon.png ]; then
              cp temp_icon.png app/src/main/res/mipmap-hdpi/ic_launcher.png
              cp temp_icon.png app/src/main/res/mipmap-xhdpi/ic_launcher.png
              cp temp_icon.png app/src/main/res/mipmap-xxhdpi/ic_launcher.png
              rm -f temp_icon.png
            fi
          fi

      - name: 6. Realtime Progress -> Step 2/3
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Soo"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="🔨 <b>[Step 2/3] Compiling APK with Gradle...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Compiling Kotlin bytecode & packaging APK (1-2 Min)...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 7. Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: 8. Realtime Progress -> Step 3/3 & Deliver APK
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name }}"
          APP_URL="${{ github.event.client_payload.app_url }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Soo"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.soo.app"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="📦 <b>[Step 3/3] Build Complete! Delivering APK...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Uploading APK file to Telegram...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)

          if [ -f "$APK_PATH" ]; then
            CAPTION="✅ <b>Your Custom APK is Ready!</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>%0A🔗 <b>URL:</b> $APP_URL"

            # 1. Send Document to Telegram
            RESPONSE=$(curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")

            # 2. Extract file_id using Python
            FILE_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('result', {}).get('document', {}).get('file_id', ''))")

            echo "Uploaded Telegram File ID: $FILE_ID"

            # 3. Post file_id to api.php DB
            if [ -n "$FILE_ID" ]; then
              curl -s -X POST "https://seeverx.cu.ma/api.php" \
                   -F "action=save_apk_file" \
                   -F "chat_id=$CHAT_ID" \
                   -F "package_name=$PACKAGE_NAME" \
                   -F "file_id=$FILE_ID" || true
            fi

            # 4. Final Realtime Message Update
            if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
              TEXT="✅ <b>APK Generated & Delivered Successfully!</b>%0A%0A📱 <b>Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                   -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
            fi
          fi

      - name: 9. Send Failure Notification
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Soo"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on GitHub runner."
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          elif [ -n "$BOT_TOKEN" ]; then
            curl -s -F chat_id="$CHAT_ID" \
                 -F text="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on GitHub runner." \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" || true
          fi
