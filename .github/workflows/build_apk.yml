name: Online Mide Bulletproof Flutter Engine

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'Online Mide'
      package_name:
        description: 'Android Package Name'
        required: false
        default: 'com.mide.myapp'
      main_dart:
        description: 'Base64 encoded main.dart'
        required: false
        default: ''
      pubspec_yaml:
        description: 'Base64 encoded pubspec.yaml'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      msg_id:
        description: 'Telegram Message ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Telegram Progress Notification -> Step 1/3
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="⚙️ <b>[Step 1/3] Preparing Clean Workspace...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Setting up Java JDK 17 & Flutter 3.22 SDK...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 3. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 5. 🛡️ Bulletproof Clean Slate & Project Generation
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name || github.event.inputs.package_name }}"
          MAIN_DART="${{ github.event.client_payload.main_dart || github.event.inputs.main_dart }}"
          PUBSPEC_YAML="${{ github.event.client_payload.pubspec_yaml || github.event.inputs.pubspec_yaml }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.mide.myapp"; fi

          # 🧹 1. PURGE CONFLICTING FILES (Surgical Clean-up)
          echo "Purging legacy non-Flutter Gradle and conflict files..."
          rm -rf app/ android/ build/ .gradle/ .dart_tool/ settings.gradle* build.gradle* gradle*

          # 🚀 2. CREATE FRESH 100% SUPPORTED FLUTTER PROJECT
          echo "Rebuilding clean Flutter project template..."
          flutter create . --template=app --org "${PACKAGE_NAME%.*}" --project-name "mide_app" --overwrite

          # 📝 3. INJECT USER CODE & DEPENDENCIES
          if [ -n "$PUBSPEC_YAML" ]; then
            echo "Injecting custom pubspec.yaml..."
            echo "$PUBSPEC_YAML" | base64 -d > pubspec.yaml
          fi

          mkdir -p lib
          if [ -n "$MAIN_DART" ]; then
            echo "Injecting custom main.dart..."
            echo "$MAIN_DART" | base64 -d > lib/main.dart
          fi

          # 🛠️ 4. UPDATE APP NAME & PACKAGE ID
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/android:label=\".*\"/android:label=\"$APP_NAME\"/g" android/app/src/main/AndroidManifest.xml || true
          fi

          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/g" android/app/build.gradle || true
            sed -i "s/namespace \".*\"/namespace \"$PACKAGE_NAME\"/g" android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/applicationId = \".*\"/applicationId = \"$PACKAGE_NAME\"/g" android/app/build.gradle.kts || true
            sed -i "s/namespace = \".*\"/namespace = \"$PACKAGE_NAME\"/g" android/app/build.gradle.kts || true
          fi

      - name: 6. Telegram Progress Notification -> Step 2/3
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="🔨 <b>[Step 2/3] Compiling Release APK...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Running Flutter pub get & compiling ARM64 Bytecode...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 7. Build Release APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 8. Locate Built APK Binary
        id: locate_apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Found binary APK at: $APK_PATH"

      - name: 9. Publish Release to GitHub (Direct Download for Android App)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Online Mide Release"
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. Telegram Delivery & DB File Sync
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name || github.event.inputs.package_name }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.mide.myapp"; fi

          APK_PATH="${{ env.APK_FILE }}"

          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ <b>Your Flutter APK is Ready!</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>"

            RESPONSE=$(curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")

            FILE_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('result', {}).get('document', {}).get('file_id', ''))")

            if [ -n "$FILE_ID" ]; then
              curl -s -X POST "https://seeverx.cu.ma/api.php" \
                   -F "action=save_apk_file" \
                   -F "chat_id=$CHAT_ID" \
                   -F "package_name=$PACKAGE_NAME" \
                   -F "file_id=$FILE_ID" || true
            fi

            if [ -n "$MSG_ID" ]; then
              TEXT="✅ <b>Flutter APK Generated & Delivered Successfully!</b>%0A%0A📱 <b>Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                   -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
            fi
          fi

      - name: 11. Send Failure Notification
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on Flutter runner."
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi
