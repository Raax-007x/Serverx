name: Online Mide Repo Compiler

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Committed Repo Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Ensure Android Build Scaffold
        run: |
          # Agar repo me android/ folder nahi hai tabhi wrapper banega
          if [ ! -d "android" ]; then
            echo "⚙️ Android folder missing. Generating scaffold..."
            flutter create . --platforms=android
          fi
          
          # Executable permission for Gradle wrapper
          chmod +x android/gradlew

      - name: 5. Fast Compile ARM64 Release APK
        run: |
          flutter pub get
          flutter build apk --target-platform android-arm64 --release

      - name: 6. Prepare Binary Output
        run: |
          mkdir -p release_out
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          cp "$APK_PATH" release_out/OnlineMide-Release.apk
          echo "✅ APK Copied Successfully: release_out/OnlineMide-Release.apk"

      - name: 7. Publish Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Online Mide Latest Release"
          files: release_out/OnlineMide-Release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
