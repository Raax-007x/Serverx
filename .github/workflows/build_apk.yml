name: Online Mide Flutter Cloud Builder

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'Online Mide'
      package_name:
        description: 'Android Package Name'
        required: false
        default: 'com.mide.myapp'
      main_dart:
        description: 'Base64 encoded main.dart'
        required: false
        default: ''
      pubspec_yaml:
        description: 'Base64 encoded pubspec.yaml'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 4. Clean & Prepare Flutter Project
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name || github.event.inputs.package_name }}"
          MAIN_DART="${{ github.event.client_payload.main_dart || github.event.inputs.main_dart }}"
          PUBSPEC_YAML="${{ github.event.client_payload.pubspec_yaml || github.event.inputs.pubspec_yaml }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.mide.myapp"; fi

          # Clean legacy conflict files
          rm -rf app/ android/ build/ .gradle/ .dart_tool/ settings.gradle* build.gradle* gradle*

          # Generate clean Flutter template
          flutter create . --template=app --org "${PACKAGE_NAME%.*}" --project-name "mide_app" --overwrite

          # Inject User Code
          mkdir -p lib
          if [ -n "$MAIN_DART" ]; then
            echo "$MAIN_DART" | base64 -d > lib/main.dart
          fi

          if [ -n "$PUBSPEC_YAML" ]; then
            echo "$PUBSPEC_YAML" | base64 -d > pubspec.yaml
          fi

          # Configure App Name & Package Name
          sed -i "s/android:label=\".*\"/android:label=\"$APP_NAME\"/g" android/app/src/main/AndroidManifest.xml || true
          sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/g" android/app/build.gradle || true
          sed -i "s/namespace \".*\"/namespace \"$PACKAGE_NAME\"/g" android/app/build.gradle || true

      - name: 5. Build Flutter Release APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 6. Prepare Fixed Binary Asset Name
        run: |
          RAW_APK=$(find build/app/outputs/flutter-apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          mkdir -p release_out
          cp "$RAW_APK" release_out/OnlineMide-Release.apk
          echo "FINAL_APK=release_out/OnlineMide-Release.apk" >> $GITHUB_ENV

      - name: 7. Publish Asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Online Mide Latest Build"
          files: release_out/OnlineMide-Release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
