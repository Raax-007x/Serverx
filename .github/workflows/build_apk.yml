name: Online Mide Flutter Cloud Builder

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App Display Name'
        required: false
        default: 'Online Mide'
      package_name:
        description: 'Android Package Name'
        required: false
        default: 'com.mide.myapp'
      main_dart:
        description: 'Base64 encoded main.dart'
        required: false
        default: ''
      pubspec_yaml:
        description: 'Base64 encoded pubspec.yaml'
        required: false
        default: ''
      bot_token:
        description: 'Telegram Bot Token'
        required: false
        default: ''
      chat_id:
        description: 'Telegram Chat ID'
        required: false
        default: ''
      msg_id:
        description: 'Telegram Message ID'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-flutter:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 2. Telegram Progress -> Step 1/3
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="⚙️ <b>[Step 1/3] Setting up Flutter Environment...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Preparing Java JDK & Flutter SDK...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 3. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 4. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: 5. Auto-Fix Gradle & Setup Clean Flutter Project
        run: |
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name || github.event.inputs.package_name }}"
          MAIN_DART="${{ github.event.client_payload.main_dart || github.event.inputs.main_dart }}"
          PUBSPEC_YAML="${{ github.event.client_payload.pubspec_yaml || github.event.inputs.pubspec_yaml }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide App"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.mide.myapp"; fi

          # 🧹 CRITICAL FIX: Purane Native Android/Webview files ko delete karke conflict remove karna
          rm -rf app/ settings.gradle.kts build.gradle.kts

          # 🚀 Create fresh Flutter Android template structure
          echo "Generating fresh supported Flutter project structure..."
          flutter create . --overwrite --platforms=android --org "${PACKAGE_NAME%.*}" --project-name "mide_app"

          # Inject User Code
          mkdir -p lib
          if [ -n "$MAIN_DART" ]; then
            echo "$MAIN_DART" | base64 -d > lib/main.dart
          fi

          if [ -n "$PUBSPEC_YAML" ]; then
            echo "$PUBSPEC_YAML" | base64 -d > pubspec.yaml
          fi

          # Update App Name in AndroidManifest
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i "s/android:label=\".*\"/android:label=\"$APP_NAME\"/" android/app/src/main/AndroidManifest.xml || true
          fi

          # Update Package Name in build.gradle / build.gradle.kts
          if [ -f "android/app/build.gradle" ]; then
            sed -i "s/applicationId \".*\"/applicationId \"$PACKAGE_NAME\"/" android/app/build.gradle || true
            sed -i "s/namespace \".*\"/namespace \"$PACKAGE_NAME\"/" android/app/build.gradle || true
          fi

          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i "s/applicationId = \".*\"/applicationId = \"$PACKAGE_NAME\"/" android/app/build.gradle.kts || true
            sed -i "s/namespace = \".*\"/namespace = \"$PACKAGE_NAME\"/" android/app/build.gradle.kts || true
          fi

      - name: 6. Telegram Progress -> Step 2/3 (Building APK)
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="🔨 <b>[Step 2/3] Compiling Flutter Release APK...</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A⏳ <i>Running Flutter Pub Get & Building ARM64 APK (1-2 Min)...</i>"
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi

      - name: 7. Build Flutter Release APK
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi

      - name: 8. Locate Compiled Release APK
        id: find_apk
        run: |
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "*arm64-v8a*.apk" -o -name "*release*.apk" | head -n 1)
          echo "APK_FILE=$APK_PATH" >> $GITHUB_ENV
          echo "Compiled Flutter APK path: $APK_PATH"

      - name: 9. Publish APK to GitHub Release (Direct Download link for Mobile App)
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Online Mide Release"
          files: ${{ env.APK_FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 10. Telegram Delivery & DB Sync
        if: success()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          PACKAGE_NAME="${{ github.event.client_payload.package_name || github.event.inputs.package_name }}"

          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide"; fi
          if [ -z "$PACKAGE_NAME" ]; then PACKAGE_NAME="com.mide.myapp"; fi

          APK_PATH="${{ env.APK_FILE }}"

          if [ -n "$BOT_TOKEN" ] && [ -n "$CHAT_ID" ] && [ -f "$APK_PATH" ]; then
            CAPTION="✅ <b>Your Flutter APK is Ready!</b>%0A%0A📱 <b>App Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>"

            RESPONSE=$(curl -s -F chat_id="$CHAT_ID" \
                 -F document=@"$APK_PATH" \
                 -F caption="$CAPTION" \
                 -F parse_mode="HTML" \
                 "https://api.telegram.org/bot$BOT_TOKEN/sendDocument")

            FILE_ID=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('result', {}).get('document', {}).get('file_id', ''))")

            if [ -n "$FILE_ID" ]; then
              curl -s -X POST "https://seeverx.cu.ma/api.php" \
                   -F "action=save_apk_file" \
                   -F "chat_id=$CHAT_ID" \
                   -F "package_name=$PACKAGE_NAME" \
                   -F "file_id=$FILE_ID" || true
            fi

            if [ -n "$MSG_ID" ]; then
              TEXT="✅ <b>Flutter APK Generated & Delivered Successfully!</b>%0A%0A📱 <b>Name:</b> $APP_NAME%0A📦 <b>Package:</b> <code>$PACKAGE_NAME</code>"
              curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                   -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
            fi
          fi

      - name: 11. Send Failure Alert
        if: failure()
        run: |
          CHAT_ID="${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}"
          MSG_ID="${{ github.event.client_payload.msg_id || github.event.inputs.msg_id }}"
          BOT_TOKEN="${{ github.event.client_payload.bot_token || github.event.inputs.bot_token }}"
          APP_NAME="${{ github.event.client_payload.app_name || github.event.inputs.app_name }}"
          if [ -z "$APP_NAME" ]; then APP_NAME="Online Mide"; fi

          if [ -n "$MSG_ID" ] && [ -n "$BOT_TOKEN" ]; then
            TEXT="❌ <b>Build Failed!</b>%0A%0ACompilation process for <b>$APP_NAME</b> failed on Flutter runner."
            curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
                 -d "chat_id=$CHAT_ID" -d "message_id=$MSG_ID" -d "text=$TEXT" -d "parse_mode=HTML" || true
          fi
