name: Online Mide Fast Compiler

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Committed Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Flutter SDK (Cached for Speed)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 4. Build ARM64 Release APK
        run: |
          flutter pub get
          flutter build apk --target-platform android-arm64 --release

      - name: 5. Prepare Binary Output
        run: |
          RAW_APK=$(find build/app/outputs/flutter-apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          mkdir -p release_out
          cp "$RAW_APK" release_out/OnlineMide-Release.apk

      - name: 6. Publish to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Online Mide Latest Release"
          files: release_out/OnlineMide-Release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
