name: Online Mide Repo Compiler

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Committed Repo Code
        uses: actions/checkout@v4

      - name: 2. Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Flutter SDK (Cached)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: 4. 🛡️ Backup User Repo Files & Fix Root Structure
        run: |
          # 🟢 Step A: Backup all committed user files from repo
          mkdir -p /tmp/user_repo_backup
          if [ -d "lib" ]; then cp -r lib /tmp/user_repo_backup/; fi
          if [ -f "pubspec.yaml" ]; then cp pubspec.yaml /tmp/user_repo_backup/; fi
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            mkdir -p /tmp/user_repo_backup/android
            cp android/app/src/main/AndroidManifest.xml /tmp/user_repo_backup/android/
          fi

          # 🟢 Step B: Re-generate Flutter Android project wrapper
          flutter create . --template=app --platforms=android --project-name serverx --overwrite

          # 🟢 Step C: Restore EXACT User Repo Code (Overwrites any default template)
          if [ -d "/tmp/user_repo_backup/lib" ]; then
            rm -rf lib
            cp -r /tmp/user_repo_backup/lib lib
            echo "✅ Successfully restored entire lib/ directory from Repo!"
          fi

          if [ -f "/tmp/user_repo_backup/pubspec.yaml" ]; then
            cp /tmp/user_repo_backup/pubspec.yaml pubspec.yaml
            echo "✅ Successfully restored user pubspec.yaml from Repo!"
          fi

          if [ -f "/tmp/user_repo_backup/android/AndroidManifest.xml" ]; then
            cp /tmp/user_repo_backup/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            echo "✅ Successfully restored AndroidManifest.xml from Repo!"
          fi

          # Enforce Flutter V2 Embedding
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "flutterEmbedding" "$MANIFEST"; then
            sed -i '/<\/application>/i \        <meta-data android:name="flutterEmbedding" android:value="2" \/>' "$MANIFEST"
          fi

      - name: 5. Fast Compile ARM64 Release APK
        run: |
          flutter pub get
          flutter build apk --target-platform android-arm64 --release

      - name: 6. Prepare Binary Output
        run: |
          RAW_APK=$(find build/app/outputs/flutter-apk/ -name "*.apk" | grep -v "unaligned" | head -n 1)
          mkdir -p release_out
          cp "$RAW_APK" release_out/OnlineMide-Release.apk

      - name: 7. Publish Asset to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Online Mide Latest Release"
          files: release_out/OnlineMide-Release.apk
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
